<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lake Bienne Weather</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root {
            --bg-main: #000000;
            --bg-nav: #000000;
            --text-primary: #f0f0f0;
            --text-secondary: #e0e0e0;
            --accent: #5dade2;
            --border: #444;
            --rain-bar: #4a90e2;
            --today-color: #ff8c42;
            --sunrise-color: #f0c040;
            --crm-bg: rgba(40, 180, 99, 0.12);
            --crm-border: rgba(40, 180, 99, 0.3);
            --crm-text: #5dde8e;
            --tick-width: 3%;
            --cols: 12% 14% 12% 10% 20% 10% 10%;
            --nav-h: 40px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;          /* document never scrolls: the container does */
            overscroll-behavior: none;
            touch-action: pan-y;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 14px;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-h);
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 6px;
        }

        .nav-inner {
            display: flex;
            width: 100%;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 6px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .nav-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            line-height: 1;
        }

        .nav-btn.active {
            border-color: var(--accent);
            background: rgba(93, 173, 226, 0.15);
        }

        .nav-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            text-align: center;
        }

        /* The scroll container. Sits under the fixed nav and fills the rest of the
           visible viewport. dvh accounts for Safari's collapsing address bar;
           the vh line above it is the fallback for older iOS. */
        #scroller {
            position: fixed;
            top: var(--nav-h);
            left: 0;
            right: 0;
            height: calc(100vh - var(--nav-h));
            height: calc(100dvh - var(--nav-h));
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        .container {
            width: 100%;
            margin: 0 auto;
            padding: 8px 6px calc(24px + env(safe-area-inset-bottom));
        }

        .day-block {
            margin-bottom: 16px;
            position: relative;
        }

        .day-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            padding: 8px 4px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2px;
        }

        .day-title.today {
            color: var(--today-color);
        }

        .day-content {
            position: relative;
            display: flex;
        }

        .tick-column {
            width: var(--tick-width);
            position: relative;
            flex-shrink: 0;
        }

        .tick-mark {
            position: absolute;
            left: 50%;
            width: 6px;
            height: 1px;
            background: #444;
            transform: translateX(-50%);
        }

        .rows-column {
            flex: 1;
        }

        .hour-row {
            display: grid;
            grid-template-columns: var(--cols);
            gap: 0;
            padding: 2px 0;
            align-items: center;
            min-height: 26px;
            border-bottom: 1px solid #1a1a1a;
        }

        .hour-row.past {
            opacity: 0.35;
        }

        .hour-row.sunrise-row {
            background: rgba(240, 192, 64, 0.08);
            border-bottom: 1px solid rgba(240, 192, 64, 0.2);
        }

        .hour-row.crm-row {
            background: var(--crm-bg);
            border-bottom: 1px solid var(--crm-border);
        }

        .hour-row .cell {
            text-align: center;
            font-size: 14px;
            white-space: nowrap;
        }

        .cell-hour {
            font-family: "SF Mono", "Menlo", "Consolas", "Liberation Mono", monospace;
            font-weight: 500;
            color: #ccc;
            font-size: 13px;
            text-align: right !important;
            padding-right: 6px;
        }

        .cell-temp {
            color: var(--text-primary);
            text-align: right !important;
            padding-right: 6px;
        }

        .cell-icon {
            font-size: 16px;
            line-height: 1;
        }

        .icon-spacer {
            visibility: hidden;
            font-size: 10px;
        }

        .cell-rain {
            display: flex;
            gap: 2px;
            justify-content: flex-start;
            padding-left: 4px;
        }

        .rain-pip {
            width: 7px;
            height: 12px;
            border-radius: 1px;
            opacity: 0.85;
        }

        .rain-pip.active {
            background: var(--rain-bar);
        }

        .rain-pip.empty {
            background: #111;
        }

        .cell-wind {
            color: var(--text-primary);
            font-size: 13px;
            text-align: center;
        }

        .cell-wind.gust {
            color: #ff9999;
        }

        .cell-arrow {
            font-size: 16px;
            color: #a0d0ff;
            line-height: 1;
        }

        .sunrise-label {
            font-family: "SF Mono", "Menlo", "Consolas", "Liberation Mono", monospace;
            font-size: 14px;
            color: var(--sunrise-color);
            text-align: right !important;
            padding-right: 6px;
        }

        .sunrise-icon {
            font-size: 16px;
        }

        .crm-label {
            font-family: "SF Mono", "Menlo", "Consolas", "Liberation Mono", monospace;
            font-size: 13px;
            color: var(--crm-text);
            text-align: right !important;
            padding-right: 6px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <div class="nav-title">Plégere au Landeron</div>
            <div class="nav-buttons">
                <a href="index.html" class="nav-btn active">🕐</a>
                <a href="swiss-radar.html" class="nav-btn">💧</a>
            </div>
        </div>
    </nav>

    <div id="scroller">
        <div class="container" id="weather-container">
            <div class="loading">Wetterdaten laden...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.open-meteo.com/v1/forecast';
        const LAT = 47.057;
        const LON = 7.072;
        const CRM_URL = 'https://api.existenz.ch/apiv1/smn/latest?locations=CRM';

        // Where the current hour sits in the visible container (0 = top, 1 = bottom)
        const FOCUS_RATIO = 0.25;
        // How many past hours stay visible above the current hour
        const PAST_HOURS = 6;

        const weatherIconsDay = {
            0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
            45: '🌫️', 48: '🌫️',
            51: '🌦️', 53: '🌦️', 55: '🌦️',
            61: '🌧️', 63: '🌧️', 65: '🌧️',
            71: '🌨️', 73: '🌨️', 75: '🌨️', 77: '🌨️',
            80: '🌦️', 81: '🌦️', 82: '🌧️',
            85: '🌨️', 86: '🌨️',
            95: '⛈️', 96: '⛈️', 99: '⛈️'
        };

        const weatherIconsNight = {
            0: '⬛', 1: '⬛', 2: '☁️', 3: '☁️',
            45: '🌫️', 48: '🌫️',
            51: '🌧️', 53: '🌧️', 55: '🌧️',
            61: '🌧️', 63: '🌧️', 65: '🌧️',
            71: '🌨️', 73: '🌨️', 75: '🌨️', 77: '🌨️',
            80: '🌧️', 81: '🌧️', 82: '🌧️',
            85: '🌨️', 86: '🌨️',
            95: '⛈️', 96: '⛈️', 99: '⛈️'
        };

        const dayNames = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

        function windArrow(degrees) {
            const arrows = ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'];
            const index = Math.round(((degrees % 360) / 45)) % 8;
            return arrows[index];
        }

        function rainPips(mm) {
            // pip 1: >0mm, pip 2: >=1mm, pip 3: >=2.5mm, pip 4: >=7.5mm
            let count = 0;
            if (mm > 0) count = 1;
            if (mm >= 1) count = 2;
            if (mm >= 2.5) count = 3;
            if (mm >= 7.5) count = 4;
            return count;
        }

        async function fetchCH1() {
            const params = new URLSearchParams({
                latitude: LAT,
                longitude: LON,
                hourly: 'temperature_2m,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m',
                daily: 'sunrise,sunset',
                timezone: 'Europe/Zurich',
                models: 'meteoswiss_icon_ch1',
                forecast_hours: 33
            });
            const res = await fetch(`${API_URL}?${params}`, { cache: 'no-store' });
            return res.json();
        }

        async function fetchCH2() {
            const params = new URLSearchParams({
                latitude: LAT,
                longitude: LON,
                hourly: 'temperature_2m,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m',
                daily: 'sunrise,sunset',
                timezone: 'Europe/Zurich',
                models: 'meteoswiss_icon_ch2',
                forecast_days: 5
            });
            const res = await fetch(`${API_URL}?${params}`, { cache: 'no-store' });
            return res.json();
        }

        async function fetchCRM() {
            try {
                const res = await fetch(CRM_URL, { cache: 'no-store' });
                const data = await res.json();
                const vals = {};
                const stamps = {};
                let newest = 0;
                for (const entry of data.payload) {
                    vals[entry.par] = entry.val;
                    stamps[entry.par] = entry.timestamp;
                    if (entry.timestamp > newest) newest = entry.timestamp;
                }
                // Parameters carry different timestamps (temp at :00, wind at :10).
                // Label the row with the wind reading's time, since that's the point of it.
                vals._timestamp = stamps.ff || newest || null;
                return vals._timestamp ? vals : null;
            } catch (e) {
                console.error('CRM fetch error:', e);
                return null;
            }
        }

        function mergeForecasts(ch1, ch2) {
            // Build CH2 lookup by time
            const ch2Map = {};
            const fields = ['temperature_2m', 'precipitation', 'weather_code', 'wind_speed_10m', 'wind_gusts_10m', 'wind_direction_10m'];
            for (let i = 0; i < ch2.hourly.time.length; i++) {
                const entry = {};
                for (const f of fields) entry[f] = ch2.hourly[f][i];
                ch2Map[ch2.hourly.time[i]] = entry;
            }

            // Start with CH1, but patch nulls from CH2
            const merged = {
                hourly: {
                    time: [...ch1.hourly.time],
                    temperature_2m: [...ch1.hourly.temperature_2m],
                    precipitation: [...ch1.hourly.precipitation],
                    weather_code: [...ch1.hourly.weather_code],
                    wind_speed_10m: [...ch1.hourly.wind_speed_10m],
                    wind_gusts_10m: [...ch1.hourly.wind_gusts_10m],
                    wind_direction_10m: [...ch1.hourly.wind_direction_10m]
                },
                daily: ch2.daily // CH2 has more days
            };

            // Patch CH1 nulls with CH2 values
            const ch1Times = new Set(ch1.hourly.time);
            for (let i = 0; i < merged.hourly.time.length; i++) {
                const t = merged.hourly.time[i];
                const ch2Entry = ch2Map[t];
                if (!ch2Entry) continue;
                for (const f of fields) {
                    if (merged.hourly[f][i] == null) {
                        merged.hourly[f][i] = ch2Entry[f];
                    }
                }
            }

            // Add CH2 hours not in CH1
            for (let i = 0; i < ch2.hourly.time.length; i++) {
                const t = ch2.hourly.time[i];
                if (!ch1Times.has(t)) {
                    merged.hourly.time.push(t);
                    for (const f of fields) merged.hourly[f].push(ch2.hourly[f][i]);
                }
            }

            // Sort by time
            const indices = merged.hourly.time.map((t, i) => i);
            indices.sort((a, b) => merged.hourly.time[a].localeCompare(merged.hourly.time[b]));

            const sorted = {
                hourly: { time: [], temperature_2m: [], precipitation: [], weather_code: [], wind_speed_10m: [], wind_gusts_10m: [], wind_direction_10m: [] },
                daily: merged.daily
            };

            for (const i of indices) {
                for (const key of Object.keys(sorted.hourly)) {
                    sorted.hourly[key].push(merged.hourly[key][i]);
                }
            }

            return sorted;
        }

        let loading = false;
        let lastLoad = 0;

        async function loadWeather() {
            if (loading) return;
            loading = true;
            try {
                const [ch1, ch2, crm] = await Promise.all([fetchCH1(), fetchCH2(), fetchCRM()]);
                const data = mergeForecasts(ch1, ch2);
                displayWeather(data, crm);
                lastLoad = Date.now();
                scheduleCenter();
            } catch (error) {
                console.error('Error loading weather:', error);
                const container = document.getElementById('weather-container');
                // Keep the last good table on screen if a refresh fails.
                if (!container.querySelector('.day-block')) {
                    container.innerHTML =
                        '<div class="loading">Wetterdaten nicht erreichbar. Seite neu laden.</div>';
                }
            } finally {
                loading = false;
            }
        }

        function displayWeather(data, crm) {
            const container = document.getElementById('weather-container');
            container.innerHTML = '';

            const hourly = data.hourly;
            const daily = data.daily;
            const now = new Date();
            const today = now.toDateString();
            const currentHour = now.getHours();

            // CRM data
            let crmTime = null;
            let crmHour = null;
            let crmMin = null;
            let crmDayStr = null;
            if (crm && crm._timestamp) {
                crmTime = new Date(crm._timestamp * 1000);
                crmHour = crmTime.getHours();
                crmMin = crmTime.getMinutes();
                crmDayStr = crmTime.toDateString();
            }

            // Determine how many unique days we have
            const daySet = new Set();
            for (const t of hourly.time) {
                daySet.add(t.slice(0, 10));
            }
            const dayStrings = [...daySet].sort();

            for (const dayStr of dayStrings) {
                const dayDate = new Date(dayStr + 'T12:00:00');
                const isToday = dayDate.toDateString() === today;
                const dayName = dayNames[dayDate.getDay()];
                const dateStr = `${dayDate.getDate()}.${dayDate.getMonth() + 1}.`;

                // Collect this day's hours, dropping the ones we don't render at all
                const dayHours = [];
                for (let i = 0; i < hourly.time.length; i++) {
                    if (!hourly.time[i].startsWith(dayStr)) continue;
                    const h = new Date(hourly.time[i]).getHours();
                    if (isToday && h < currentHour - PAST_HOURS) continue;
                    dayHours.push(i);
                }
                if (dayHours.length === 0) continue;

                const firstHour = new Date(hourly.time[dayHours[0]]).getHours();

                // Find sunrise/sunset for this day
                let sunriseHour = -1, sunriseMin = 0, sunsetHour = -1, sunsetMin = 0;
                let sunriseTotalMin = -1, sunsetTotalMin = -1;

                if (daily && daily.sunrise) {
                    for (let d = 0; d < daily.sunrise.length; d++) {
                        if (daily.sunrise[d].startsWith(dayStr)) {
                            const srDate = new Date(daily.sunrise[d]);
                            sunriseHour = srDate.getHours();
                            sunriseMin = srDate.getMinutes();
                            sunriseTotalMin = sunriseHour * 60 + sunriseMin;
                            break;
                        }
                    }
                    for (let d = 0; d < daily.sunset.length; d++) {
                        if (daily.sunset[d].startsWith(dayStr)) {
                            const ssDate = new Date(daily.sunset[d]);
                            sunsetHour = ssDate.getHours();
                            sunsetMin = ssDate.getMinutes();
                            sunsetTotalMin = sunsetHour * 60 + sunsetMin;
                            break;
                        }
                    }
                }

                const block = document.createElement('div');
                block.className = 'day-block';

                const title = document.createElement('div');
                title.className = `day-title${isToday ? ' today' : ''}`;
                title.textContent = `${dayName} ${dateStr}`;
                block.appendChild(title);

                const dayContent = document.createElement('div');
                dayContent.className = 'day-content';

                const tickCol = document.createElement('div');
                tickCol.className = 'tick-column';

                const rowsCol = document.createElement('div');
                rowsCol.className = 'rows-column';

                let sunriseInserted = false;
                let sunsetInserted = false;
                let crmInserted = false;

                // A sun event that happened before the first rendered hour has no row
                // to attach to — suppress it instead of dumping it at the top.
                if (sunriseTotalMin >= 0 && sunriseTotalMin < firstHour * 60) sunriseInserted = true;
                if (sunsetTotalMin >= 0 && sunsetTotalMin < firstHour * 60) sunsetInserted = true;

                for (const idx of dayHours) {
                    const timeStr = hourly.time[idx];
                    const rowDate = new Date(timeStr);
                    const h = rowDate.getHours();
                    const hourStartMin = h * 60;

                    // Insert sunrise before this row if needed
                    if (!sunriseInserted && sunriseTotalMin >= 0 && sunriseTotalMin < hourStartMin + 60 && sunriseTotalMin <= hourStartMin) {
                        rowsCol.appendChild(makeSunRow('☀↑', sunriseHour, sunriseMin));
                        sunriseInserted = true;
                    }

                    const hourMid = h * 60 + 30;
                    const isDaytime = sunriseTotalMin >= 0 && hourMid >= sunriseTotalMin && hourMid <= sunsetTotalMin;

                    const temp = Math.round(hourly.temperature_2m[idx] ?? 0);
                    const wmoCode = hourly.weather_code[idx];
                    const icon = wmoCode != null
                        ? (isDaytime ? (weatherIconsDay[wmoCode] || '') : (weatherIconsNight[wmoCode] || ''))
                        : '';
                    const precip = hourly.precipitation[idx] ?? 0;
                    const windAvg = Math.round(hourly.wind_speed_10m[idx] ?? 0);
                    const windGust = Math.round(hourly.wind_gusts_10m[idx] ?? 0);
                    const windDeg = hourly.wind_direction_10m[idx] ?? 0;
                    const arrow = windArrow(windDeg);

                    const barCount = rainPips(precip);

                    const isPast = isToday && h < currentHour;
                    const isNow = isToday && h === currentHour;

                    const row = document.createElement('div');
                    row.className = 'hour-row' + (isPast ? ' past' : '') + (isNow ? ' now-row' : '');
                    row.dataset.hour = h;

                    let rainHTML = '';
                    for (let b = 0; b < 4; b++) {
                        rainHTML += b < barCount
                            ? '<div class="rain-pip active"></div>'
                            : '<div class="rain-pip empty"></div>';
                    }

                    const iconHTML = `${icon}<span class="icon-spacer">↑</span>`;

                    row.innerHTML =
                        `<div class="cell cell-hour">${h}:00</div>` +
                        `<div class="cell cell-temp">${temp}°</div>` +
                        `<div class="cell cell-icon">${iconHTML}</div>` +
                        `<div class="cell cell-rain">${rainHTML}</div>` +
                        `<div class="cell cell-wind">${windAvg}</div>` +
                        `<div class="cell cell-wind gust">${windGust > windAvg ? windGust : ''}</div>` +
                        `<div class="cell cell-arrow">${arrow}</div>`;

                    rowsCol.appendChild(row);

                    // Insert CRM row after the forecast row for this hour
                    if (!crmInserted && crmTime && crmDayStr === dayDate.toDateString() && crmHour === h) {
                        rowsCol.appendChild(makeCrmRow(crm, crmHour, crmMin));
                        crmInserted = true;
                    }

                    // Insert sunrise after this row if it falls within this hour
                    if (!sunriseInserted && sunriseTotalMin >= 0 && sunriseTotalMin >= hourStartMin && sunriseTotalMin < hourStartMin + 60) {
                        rowsCol.appendChild(makeSunRow('☀↑', sunriseHour, sunriseMin));
                        sunriseInserted = true;
                    }

                    if (!sunsetInserted && sunsetTotalMin >= 0 && sunsetHour === h) {
                        rowsCol.appendChild(makeSunRow('☀↓', sunsetHour, sunsetMin));
                        sunsetInserted = true;
                    }
                }

                dayContent.appendChild(tickCol);
                dayContent.appendChild(rowsCol);
                block.appendChild(dayContent);
                container.appendChild(block);

                // Position ticks after DOM attach (absolute, so no layout shift)
                requestAnimationFrame(() => {
                    const hourRows = rowsCol.querySelectorAll('.hour-row:not(.sunrise-row):not(.crm-row)');
                    hourRows.forEach(r => {
                        const midY = r.offsetTop + r.offsetHeight / 2;
                        const tick = document.createElement('div');
                        tick.className = 'tick-mark';
                        tick.style.top = midY + 'px';
                        tickCol.appendChild(tick);
                    });
                });
            }
        }

        function makeSunRow(label, hour, min) {
            const row = document.createElement('div');
            row.className = 'hour-row sunrise-row';
            const timeStr = `${hour}:${String(min).padStart(2, '0')}`;
            row.innerHTML =
                `<div class="cell sunrise-label">${timeStr}</div>` +
                `<div class="cell"></div>` +
                `<div class="cell sunrise-icon">${label}</div>` +
                `<div class="cell"></div>` +
                `<div class="cell"></div>` +
                `<div class="cell"></div>` +
                `<div class="cell"></div>`;
            return row;
        }

        function makeCrmRow(crm, hour, min) {
            const row = document.createElement('div');
            row.className = 'hour-row crm-row';
            const timeStr = `${hour}:${String(min).padStart(2, '0')}`;

            const temp = crm.tt != null ? Math.round(crm.tt) : '';
            const windAvg = crm.ff != null ? Math.round(crm.ff) : '';
            const windGust = crm.fx != null ? Math.round(crm.fx) : '';
            const windDir = crm.dd != null ? crm.dd : 0;
            const arrow = crm.dd != null ? windArrow(windDir) : '';
            const precip = crm.rr != null ? crm.rr : 0;
            const barCount = rainPips(precip);

            let rainHTML = '';
            for (let b = 0; b < 4; b++) {
                rainHTML += b < barCount
                    ? '<div class="rain-pip active"></div>'
                    : '<div class="rain-pip empty"></div>';
            }

            const showGust = windGust && windAvg && windGust > windAvg;

            row.innerHTML =
                `<div class="cell crm-label">${timeStr}</div>` +
                `<div class="cell cell-temp" style="color:var(--crm-text)">${temp !== '' ? temp + '°' : ''}</div>` +
                `<div class="cell"></div>` +
                `<div class="cell cell-rain">${rainHTML}</div>` +
                `<div class="cell cell-wind" style="color:var(--crm-text)">${windAvg}</div>` +
                `<div class="cell cell-wind gust">${showGust ? windGust : ''}</div>` +
                `<div class="cell cell-arrow">${arrow}</div>`;

            return row;
        }

        /* ---- Centering ------------------------------------------------------
           Inside a fixed-height scroll container the geometry is stable: no
           address-bar resize, no scroll restoration, no layout viewport games.
           One rect measurement is enough; the delayed retry only covers late
           font/emoji metrics and is cancelled the moment you touch the list. */

        let userScrolled = false;
        let recenterTimer = null;

        function centerNow() {
            const scroller = document.getElementById('scroller');
            const target = document.querySelector('.crm-row')
                        || document.querySelector('.now-row')
                        || document.querySelector('.day-title.today');
            if (!scroller || !target) return;

            const t = target.getBoundingClientRect();
            const c = scroller.getBoundingClientRect();
            const delta = t.top - c.top - scroller.clientHeight * FOCUS_RATIO;
            const max = scroller.scrollHeight - scroller.clientHeight;
            scroller.scrollTop = Math.max(0, Math.min(max, scroller.scrollTop + delta));
        }

        function scheduleCenter() {
            userScrolled = false;
            clearTimeout(recenterTimer);
            requestAnimationFrame(() => requestAnimationFrame(centerNow));
            recenterTimer = setTimeout(() => { if (!userScrolled) centerNow(); }, 400);
        }

        document.getElementById('scroller').addEventListener('touchstart', () => {
            userScrolled = true;
        }, { passive: true });

        /* ---- Refresh on return ---------------------------------------------
           The document itself no longer scrolls, so Safari's pull-to-refresh is
           gone. This replaces it: coming back to the page reloads and re-centers. */

        function refreshIfStale() {
            if (Date.now() - lastLoad < 3000) return;
            loadWeather();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') refreshIfStale();
        });

        window.addEventListener('pageshow', (e) => {
            if (e.persisted) refreshIfStale();
        });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        loadWeather();
    </script>
</body>
</html>
